<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xt-prison HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="prison-hud" class="hud-container hidden">
    <!-- Main Full Card -->
    <div class="hud-card">
      <!-- Header -->
      <div class="hud-header">
        <div class="hud-icon-box">
          <svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 12v.01M10 12v.01M12 10v.01M12 14v.01M4.5 9.5a4 4 0 0 1 7 0M12.5 9.5a4 4 0 0 1 7 0M4.5 14.5a4 4 0 0 0 7 0M12.5 14.5a4 4 0 0 0 7 0M2 12h2.5M19.5 12H22M9 12h6"/>
          </svg>
        </div>
        <div class="hud-header-text">
          <div class="hud-title">CEZA DURUMU</div>
          <div class="hud-subtitle">Kalan Süre</div>
        </div>
        <div class="hud-task-badge">
          Görev: <span id="task-count">0</span>
        </div>
      </div>

      <!-- Main Body -->
      <div class="hud-body">
        <div class="time-wrapper">
          <div id="jail-time-display" class="time-text">0 Ay</div>
          <div id="float-container" class="float-container"></div>
        </div>

        <!-- Modern Sleek Progress Bar -->
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <div class="hud-location-text">Bolingbroke Cezaevi</div>
      </div>

      <!-- Tasks Status List -->
      <div class="hud-tasks-section">
        <!-- Elektrik Panosu -->
        <div class="task-row" id="row-electrical">
          <div class="task-left">
            <svg class="task-icon text-yellow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            <span class="task-name">Elektrik Panosu</span>
          </div>
          <div class="task-badge" id="badge-electrical">0/5</div>
        </div>

        <!-- Avlu Temizliği -->
        <div class="task-row" id="row-cleaning">
          <div class="task-left">
            <svg class="task-icon text-cyan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
            <span class="task-name">Avlu Temizliği</span>
          </div>
          <div class="task-badge" id="badge-cleaning">0/5</div>
        </div>

        <!-- Mutfak İşleri -->
        <div class="task-row" id="row-kitchen">
          <div class="task-left">
            <svg class="task-icon text-green" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3"/>
            </svg>
            <span class="task-name">Mutfak İşleri</span>
          </div>
          <div class="task-badge" id="badge-kitchen">0/5</div>
        </div>
      </div>

      <!-- Helper Shortcut Hint -->
      <div class="hud-helper">
        <span class="key-badge">G</span> Menüyü Gizle
      </div>
    </div>

    <!-- Collapsed Side Tab (G ile gizlendiğinde solda sağa bakan ok paneli) -->
    <div id="collapsed-tab" class="collapsed-tab">
      <div class="tab-icon-box">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 12v.01M10 12v.01M12 10v.01M12 14v.01M4.5 9.5a4 4 0 0 1 7 0M12.5 9.5a4 4 0 0 1 7 0M4.5 14.5a4 4 0 0 0 7 0M12.5 14.5a4 4 0 0 0 7 0M2 12h2.5M19.5 12H22M9 12h6"/>
        </svg>
      </div>
      <div class="tab-info">
        <div class="tab-label">CEZA</div>
        <div id="tab-time" class="tab-time">0 Ay</div>
      </div>
      <div class="tab-arrow-container">
        <span class="key-badge tab-key">G</span>
        <svg class="tab-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
