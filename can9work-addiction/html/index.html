<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
        }
        #vignette-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 25%, rgba(0,0,0,0.65) 60%, rgba(0,0,0,0.96) 95%);
        }
    </style>
</head>
<body>
    <div id="vignette-overlay"></div>

    <script>
        let currentAudio = null;
        const vignette = document.getElementById("vignette-overlay");

        window.addEventListener("message", function(event) {
            const data = event.data;
            if (data.action === "playSound") {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
                const audio = new Audio("sounds/" + data.sound);
                audio.volume = Math.min(0.10, Math.max(0.0, data.volume || 0.05));
                audio.play().catch(function(e) {});
                currentAudio = audio;
            } else if (data.action === "stopSound") {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
            } else if (data.action === "showVignette") {
                const duration = data.duration || 4500;
                vignette.style.opacity = "1";
                setTimeout(() => {
                    vignette.style.opacity = "0";
                }, duration);
            }
        });
    </script>
</body>
</html>
