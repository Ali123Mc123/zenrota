  // ---- CRT post ----
  function drawCRT() {
    ctx.globalAlpha = 0.16; ctx.fillStyle = '#000';
    for (var y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
    ctx.globalAlpha = 0.05;
    for (var x = 0; x < W; x += 3) { ctx.fillStyle = (x % 6 === 0) ? '#ff0000' : '#0000ff'; ctx.fillRect(x, 0, 1, H); }
    ctx.globalAlpha = 1;
    var vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    var tg = ctx.createLinearGradient(0, 0, 0, 60);
    tg.addColorStop(0, 'rgba(255,255,255,0.05)'); tg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 60);
  }

  // ---- main render (does NOT depend on running; always draws something) ----
  function render() {
    var sxk = 0, syk = 0;
    if (game && game.shake > 0) { sxk = (Math.random() - 0.5) * game.shake; syk = (Math.random() - 0.5) * game.shake; }
    ctx.setTransform(1, 0, 0, 1, sxk, syk);
    ctx.clearRect(-20, -20, W + 40, H + 40);

    if (!game || game.state === STATE.TITLE) { drawTitle(); drawCRT(); return; }

    var g = game;
    drawBackdrop(g);
    drawPortal(g);

    // lightning visual
    if (g.lightningT && g.lightningT > 0) {
      ctx.strokeStyle = 'rgba(190,227,255,' + Math.min(1, g.lightningT * 4) + ')'; ctx.lineWidth = 4;
      for (var i = 0; i < g.enemies.length; i++) {
        var e = g.enemies[i]; if (e.dead) continue;
        var jx = sx(g, e.wx);
        ctx.beginPath(); ctx.moveTo(jx, 0);
        for (var s = 0; s < 6; s++) ctx.lineTo(jx + (Math.random() - 0.5) * 30, (e.y - e.h) * (s / 6));
        ctx.lineTo(jx, e.y - e.h * 0.5); ctx.stroke();
      }
      g.lightningT -= 1 / 60;
    }

    for (var p = 0; p < g.pickups.length; p++) drawPickup(g, g.pickups[p]);
    for (var hz = 0; hz < g.hazards.length; hz++) drawHazard(g, g.hazards[hz]);
    for (var s2 = 0; s2 < g.shocks.length; s2++) drawShock(g, g.shocks[s2]);
    for (var e2 = 0; e2 < g.enemies.length; e2++) if (!g.enemies[e2].dead) drawEnemy(g, g.enemies[e2]);
    if (g.boss && !g.boss.dead) drawBoss(g);
    for (var b = 0; b < g.bolts.length; b++) drawBolt(g, g.bolts[b]);
    drawHero(g, sx(g, g.hero.wx));

    for (var pa = 0; pa < g.particles.length; pa++) {
      var pt = g.particles[pa];
      ctx.globalAlpha = Math.max(0, Math.min(1, pt.life * 2));
      ctx.fillStyle = pt.color; ctx.fillRect(pt.x - pt.r, pt.y - pt.r, pt.r * 2, pt.r * 2);
    }
    ctx.globalAlpha = 1;

    for (var f = 0; f < g.floaters.length; f++) {
      var fl = g.floaters[f];
      ctx.globalAlpha = Math.max(0, 1 - fl.t / fl.life);
      pxTextOutlined(fl.txt, fl.x, fl.y, 3, fl.color, '#1a1208', 'center');
    }
    ctx.globalAlpha = 1;

    drawHUD(g);

    // banner
    if (g.bannerT > 0) {
      var a = Math.min(1, g.bannerT);
      ctx.globalAlpha = a;
      pxTextOutlined(g.bannerTxt, W / 2, H / 2 - 40, 8, g.boss ? '#ff4d8f' : '#f2c12e', '#3a0a0a', 'center');
      pxTextOutlined(g.bannerSub, W / 2, H / 2 + 40, 4, '#ffffff', '#222', 'center');
      ctx.globalAlpha = 1;
    }

    // transition fade
    if (g.transT > 0) {
      var ta = 1 - Math.abs(g.transT - 0.7) / 0.7;   // fade out then in
      ctx.fillStyle = 'rgba(8,4,18,' + Math.max(0, Math.min(1, ta)) + ')';
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    // hit flash
    if (g.flashT > 0) {
      ctx.fillStyle = 'rgba(' + g.flashCol + ',' + Math.min(0.5, g.flashT * 3) + ')';
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    // game over
    if (g.state === STATE.OVER) {
      ctx.fillStyle = 'rgba(8,6,16,0.66)'; ctx.fillRect(-20, -20, W + 40, H + 40);
      pxTextOutlined('GAME OVER', W / 2, H / 2 - 90, 10, '#bf2b2b', '#f2c12e', 'center');
      pxTextOutlined('SCORE ' + String(g.score).padStart(6, '0'), W / 2, H / 2 + 20, 5, '#f2c12e', '#5a2f0a', 'center');
      if (Math.floor(g.overT * 1.5) % 2 === 0 && g.overT > 1.0)
        pxText('PRESS  E  TO  PLAY  AGAIN', W / 2, H / 2 + 110, 3, '#cdbfae', 'center');
    }

    drawCRT();
  }

  // -------------------------------------------------------------------------
  //  Main loop
  // -------------------------------------------------------------------------
  // DUI SLEEP CONTRACT: after the player leaves, Lua sends {action:'sleep'} and this page STOPS
  // rendering (the rAF loop parks). A cached CEF page drawing its attract screen at 60fps was
  // silently costing client FPS everywhere (invisible to resmon). config/reset/start wake it.
  var RAF_LIVE = true;
  function duiSleep() { RAF_LIVE = false; }
  function duiWake() { if (!RAF_LIVE) { RAF_LIVE = true; last = 0; requestAnimationFrame(loop); } }
  var last = 0;
  function loop(ts) {
    if (!RAF_LIVE) return;
    if (!last) last = ts;
    var dt = (ts - last) / 1000; last = ts;
    if (dt > 0.05) dt = 0.05;
    titleT += dt;
    if (running) {
      update(dt);
      if (game && game.state === STATE.OVER && (input.attack && !prevAttack) && game.overT > 1.0) { startGame(); }
      if (game && game.state === STATE.OVER) { prevAttack = input.attack; prevUp = input.up; }
    }
    render();
    requestAnimationFrame(loop);
  }

  // -------------------------------------------------------------------------
  //  Control surface from Lua (ONLY input / start / stop / reset)
  // -------------------------------------------------------------------------
  var msgCount = 0;
  window.addEventListener('message', function (e) {
    var d;
    try { d = (typeof e.data === 'string') ? JSON.parse(e.data) : (e.data || {}); }
    catch (err) { flog('message parse error: ' + err); return; }
    msgCount++;
    if (msgCount <= 3 || d.action !== 'input') flog('msg#' + msgCount + ' ' + JSON.stringify(d).slice(0, 120));
    if (d.action === 'sleep') { duiSleep(); return; }
    if (d.action === 'config' || d.action === 'reset' || d.action === 'start') duiWake();
    if (d.action === 'input') {
      var k = d.keys || {};
      input.left = !!k.left; input.right = !!k.right; input.up = !!k.up; input.attack = !!k.attack;
    } else if (d.action === 'start') {
      startGame();
    } else if (d.action === 'stop') {
      running = false; flog('stop');
    } else if (d.action === 'reset') {
      resetToTitle();
    } else if (d.action === 'volume') {
      masterVol = Math.max(0, Math.min(1, +d.level || 0));
      if (masterGain) masterGain.gain.value = masterVol;
    }
  });

  // -------------------------------------------------------------------------
  //  Boot — idle & silent. render() draws the title; Lua sends 'start' to play.
  // -------------------------------------------------------------------------
  resetToTitle();
  requestAnimationFrame(loop);

  window.addEventListener('load', function () {
    flog('window load — sending wizardReady');
    fetch('https://' + RES + '/wizardReady', { method: 'POST', body: '{}' })
      .then(function () { flog('wizardReady POST ok'); })
      .catch(function (e) { flog('wizardReady POST failed: ' + e); });
  });
  flog('script end · readyState=' + document.readyState);
  </script>
<!-- ARCADE HIGH-SCORES overlay (attract screen). Fed by {action:'leaderboard',entries:[{name,score}]}
     from the cabinet before play. Self-contained + own message listener; shown on 'leaderboard',
     hidden on 'start'/'reset'. Additive — does not touch the game's own message handler. -->
<style>
  #arc-hs{position:fixed;top:50%;right:3.5%;transform:translateY(-50%);width:33%;max-width:440px;
    display:none;font-family:'Consolas','Menlo','Courier New',monospace;color:#eaf6ff;z-index:99999;
    background:rgba(6,10,20,.74);border:2px solid rgba(90,200,255,.55);border-radius:10px;
    box-shadow:0 0 22px rgba(60,180,255,.35),inset 0 0 18px rgba(20,60,120,.4);padding:14px 16px 12px}
  #arc-hs h3{margin:0 0 9px;text-align:center;font-size:21px;letter-spacing:3px;color:#5fd0ff;
    text-shadow:0 0 8px rgba(80,200,255,.9);text-transform:uppercase}
  #arc-hs ol{list-style:none;margin:0;padding:0}
  #arc-hs li{display:flex;align-items:baseline;gap:9px;padding:3px 4px;font-size:16px;
    border-bottom:1px solid rgba(90,160,220,.14)}
  #arc-hs li:nth-child(1){color:#ffd86b;text-shadow:0 0 8px rgba(255,200,70,.7)}
  #arc-hs li:nth-child(3){color:#e6b98a}
  #arc-hs .r{width:24px;text-align:right;opacity:.75}
  #arc-hs .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
  #arc-hs .s{font-variant-numeric:tabular-nums;font-weight:bold}
  #arc-hs .e{opacity:.6;text-align:center;padding:12px 0;font-size:14px;letter-spacing:1px}
</style>
<div id="arc-hs"><h3>High Scores</h3><ol id="arc-hs-list"></ol></div>
<script>
(function(){
  var box=document.getElementById('arc-hs'),list=document.getElementById('arc-hs-list'),have=[];
  function esc(s){return String(s==null?'':s).replace(/[<&>]/g,function(c){return{'<':'&lt;','&':'&amp;','>':'&gt;'}[c];});}
  function render(){
    list.innerHTML='';
    if(!have.length){list.innerHTML='<li class="e">NO SCORES YET — BE THE FIRST</li>';return;}
    for(var i=0;i<have.length&&i<10;i++){
      var e=have[i]||{},li=document.createElement('li');
      li.innerHTML='<span class="r">'+(i+1)+'</span><span class="n">'+esc(e.name||'?')+'</span><span class="s">'+((parseInt(e.score,10)||0).toLocaleString())+'</span>';
      list.appendChild(li);
    }
  }
  window.addEventListener('message',function(ev){
    var d;try{d=(typeof ev.data==='string')?JSON.parse(ev.data):(ev.data||{});}catch(x){return;}
    var a=d.action||d.type;
    if(a==='leaderboard'){have=Array.isArray(d.entries)?d.entries:[];render();box.style.display='block';}
    else if(a==='start'||a==='reset'){box.style.display='none';}
  });
})();
</script>
