<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
      font-family: Arial, Helvetica, sans-serif; }
    /* the machine screen */
    #screen { position: absolute; inset: 0;
      background: radial-gradient(120% 80% at 50% 0%, #2a0b2e 0%, #160418 55%, #0a020c 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
    #title { position: absolute; top: 3%; width: 100%; text-align: center;
      color: #ff79b0; font-weight: 900; font-size: 7vw; letter-spacing: .04em;
      text-shadow: 0 0 3vw #ff2e74; opacity: .9; }
    #label { position: absolute; top: 38%; width: 100%; text-align: center; color: #fff;
      font-weight: 900; font-size: 10vw; letter-spacing: 0.03em; text-shadow: 0 0 4vw #ff2e74;
      opacity: 0; transition: opacity .25s; padding: 0 4%; box-sizing: border-box; }
    #label.show { opacity: 1; }
    #bar { width: 42%; height: 74%; margin-bottom: 7%; border: 0.8vw solid #4a0f44;
      border-radius: 1.2vw; background: #11041a; position: relative; overflow: hidden;
      box-shadow: inset 0 0 4vw #000, 0 0 2vw #ff2e7433; }
    /* tick marks down the meter */
    #bar::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 9%,
        rgba(255,255,255,.10) 9%, rgba(255,255,255,.10) 10%); }
    #fill { position: absolute; left: 0; bottom: 0; width: 100%; height: 0%;
      background: linear-gradient(0deg, #b3003a, #ff3b6b 70%, #ff8fb0);
      box-shadow: 0 0 5vw #ff3b6b; }
  </style>
</head>
<body>
  <div id="screen">
    <div id="title">LOVE&nbsp;TESTER</div>
    <div id="label"></div>
    <div id="bar"><div id="fill"></div></div>
  </div>
  <script>
    const fill = document.getElementById('fill');
    const label = document.getElementById('label');
    const clamp = (v) => Math.max(0, Math.min(1, v));
    // NUI callbacks live at https://<resourceName>/<cb> — strip the cfx-nui- prefix off the host.
    const RES = (location.host || '').replace(/^cfx-nui-/, '') || 'prompt_arcade_games';

    // 10-rung scale (ICE COLD .. SIZZLIN'), index 0..9 — mirrors the Lua CFG.ratings labels.
    const LABELS = [
      'ICE COLD', 'COLD SHOULDER', 'THAW OUT', 'CLAMMY', 'WARMER',
      'FLUSHED', "GETTIN' STEAMY", 'BURNING LOINS', "HOT N' HEAVY", "SIZZLIN'"
    ];

    // pipe the page's own lifecycle/errors back to the Lua console (extensive logging)
    function flog(msg) {
      try {
        fetch(`https://${RES}/loveLog`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ msg: String(msg) })
        }).catch(() => {});
      } catch (e) {}
    }
    window.onerror = (m, src, ln, col) => { flog('JS ERROR: ' + m + ' @' + ln + ':' + col); };
    flog('script start · host=' + location.host + ' · res=' + RES);

    // deterministic fill: animate 0 -> target over `ms`, then reveal the rung's label.
    // Driven only by {level, ms}, so two clients given the same level draw an identical meter.
    let raf = 0;
    function stopAnim() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
    function resetScreen() {
      stopAnim();
      fill.style.height = '0%';
      label.textContent = '';
      label.classList.remove('show');
    }
    function playMeter(level, ms) {
      stopAnim();
      level = Math.max(0, Math.min(9, Math.floor(Number(level) || 0)));
      ms = Math.max(200, Number(ms) || 2600);
      // each rung is a 10% band; land mid-band so the fill visibly stops on the level.
      const target = clamp((level + 0.5) / 10);
      label.textContent = '';
      label.classList.remove('show');
      const start = performance.now();
      const tick = (now) => {
        // ease-out so the needle decelerates onto the final rung
        let t = clamp((now - start) / ms);
        const eased = 1 - Math.pow(1 - t, 2);
        fill.style.height = (target * eased * 100) + '%';
        if (t < 1) { raf = requestAnimationFrame(tick); }
        else {
          raf = 0;
          fill.style.height = (target * 100) + '%';
          label.textContent = LABELS[level] || '';
          label.classList.add('show');
          flog('meter settled on level ' + level + ' (' + (LABELS[level] || '') + ')');
        }
      };
      raf = requestAnimationFrame(tick);
      flog('play level=' + level + ' ms=' + ms);
    }

    let msgCount = 0;
    window.addEventListener('message', (e) => {
      let d;
      try { d = (typeof e.data === 'string') ? JSON.parse(e.data) : (e.data || {}); }
      catch (err) { flog('message parse error: ' + err); return; }
      msgCount++;
      if (msgCount <= 3 || (d.type !== 'meter' && d.action !== 'meter')) {
        flog('msg#' + msgCount + ' ' + JSON.stringify(d));
      }
      const kind = d.action || d.type;
      if (kind === 'play') {
        // deterministic, shared mechanic: fill to `level` over `ms`, reveal its label.
        playMeter(d.level, d.ms);
      } else if (kind === 'reset') {
        resetScreen();
      } else if (kind === 'meter') {
        // legacy manual drive (used by /lovedbg sanity checks): raw 0..1 fill.
        stopAnim();
        fill.style.height = (clamp(d.value) * 100) + '%';
      } else if (kind === 'result') {
        // legacy manual label
        label.textContent = d.label || '';
        label.classList.add('show');
      }
    });

    // tell the Lua side the page is loaded, so it only swaps the screen once there's content.
    window.addEventListener('load', () => {
      flog('window load — sending loveReady');
      fetch(`https://${RES}/loveReady`, { method: 'POST', body: '{}' })
        .then(() => flog('loveReady POST ok'))
        .catch((e) => flog('loveReady POST failed: ' + e));
    });
    flog('script end · readyState=' + document.readyState);
  </script>
</body>
</html>
