<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css" />
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div id="dots"></div>
    <div id="prompt">
      <div class="key" id="prompt-key">E</div>
      <p id="prompt-label"></p>
      <p id="prompt-count"></p>
    </div>
    <div id="menu">
      <div id="options-wrapper"></div>
      <div id="hint">
        <span><span class="key">↑↓</span><span id="hint-select">Seç</span></span>
        <span><span class="key" id="hint-key">E</span><span class="key">↵</span><span class="key">Tık</span><span id="hint-confirm">Onayla</span></span>
        <span><span class="key">⌫</span><span id="hint-close">Kapat</span></span>
      </div>
    </div>
    <script defer type="module" src="js/main.js"></script>
  </body>
</html>
