<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: transparent; } canvas { display: block; }</style>
</head>
<body>
<canvas id="atlas" width="1024" height="1024"></canvas>
<script>
// The thumbnail atlas (6-tahta-video-sanat.md 3.2, remote view): 16 cells of 256 px, only when data URL textures do not
// load (packages/ink/client/statics.lua). Lua sends { cell, src }; the picture is drawn into its cell.
const ctx = document.getElementById('atlas').getContext('2d')
window.addEventListener('message', (event) => {
  const d = event.data
  if (!d || typeof d.cell !== 'number' || d.cell < 0 || d.cell > 15 || typeof d.src !== 'string' || !d.src.startsWith('data:image/')) return
  const img = new Image()
  img.onload = () => {
    const x = (d.cell % 4) * 256, y = Math.floor(d.cell / 4) * 256
    ctx.clearRect(x, y, 256, 256)
    ctx.drawImage(img, x, y, 256, 256)
  }
  img.src = d.src
})
</script>
</body>
</html>
