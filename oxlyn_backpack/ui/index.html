<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Padlock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      /* background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px); */
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body.visible {
      display: flex;
    }

    .panel {
      background: #1e2126;
      background: linear-gradient(145deg, #25282e, #17191d);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 30px 24px 26px;
      width: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 1px 2px rgba(255, 255, 255, 0.05) inset, inset 0 20px 40px rgba(255, 255, 255, 0.03);
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 120px;
      background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Icon ── */
    .icon-wrap {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .icon-wrap svg {
      width: 28px;
      height: 28px;
      color: #8fa6ba;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      transition: all .35s;
    }

    .icon-wrap.success {
      background: rgba(111, 207, 151, 0.1);
      border-color: rgba(111, 207, 151, 0.2);
    }

    .icon-wrap.success svg {
      color: #6fcf97;
      filter: drop-shadow(0 0 8px rgba(111, 207, 151, 0.6));
    }

    .icon-wrap.fail {
      background: rgba(235, 87, 87, 0.1);
      border-color: rgba(235, 87, 87, 0.2);
    }

    .icon-wrap.fail svg {
      color: #eb5757;
      filter: drop-shadow(0 0 8px rgba(235, 87, 87, 0.6));
    }

    /* ── Fingerprint hold button ── */
    .fp-hold-btn {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #1a1c22;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.06), 0 10px 20px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.1s;
    }

    .fp-hold-btn:active {
      transform: scale(0.97);
    }

    .fp-led {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4da8da;
      box-shadow: 0 0 10px 2px rgba(77, 168, 218, 0.8);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .fp-hold-btn.holding .fp-led {
      background: #6fcf97;
      box-shadow: 0 0 12px 3px rgba(111, 207, 151, 0.9);
    }

    .fp-hold-btn.done .fp-led {
      background: #6fcf97;
      box-shadow: 0 0 16px 4px rgba(111, 207, 151, 1);
    }

    .fp-hold-btn.fail-btn .fp-led {
      background: #eb5757;
      box-shadow: 0 0 12px 3px rgba(235, 87, 87, 0.9);
    }

    .fp-sensor {
      width: 70px;
      height: 70px;
      background: linear-gradient(145deg, #22252a, #16181b);
      border: 2px solid #0d0f12;
      border-radius: 16px;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.04), inset 0 -2px 6px rgba(0, 0, 0, 0.5), 0 4px 8px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .fp-sensor svg {
      width: 44px;
      height: 44px;
      color: #4a5464;
      transition: color 0.3s;
      pointer-events: none;
    }

    .fp-fill-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      overflow: hidden;
    }

    .fp-fill-wrap svg {
      position: absolute;
      bottom: 13px;
      left: 13px;
      width: 44px;
      height: 44px;
      color: #6fcf97;
      filter: drop-shadow(0 0 6px rgba(111, 207, 151, 0.6));
    }

    .fp-hold-btn.fail-btn .fp-fill-wrap {
      height: 100% !important;
    }

    .fp-hold-btn.fail-btn .fp-fill-wrap svg {
      color: #eb5757;
      filter: drop-shadow(0 0 6px rgba(235, 87, 87, 0.6));
    }

    .fp-dots {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .fp-dots .dot-led {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #d0d6e0;
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
    }

    /* ── Title ── */
    .title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #cdd4df;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    /* ── Status line (fingerprint mode) ── */
    .status {
      font-size: 13px;
      font-weight: 500;
      color: #8fa6ba;
      letter-spacing: 0.5px;
      min-height: 18px;
      text-align: center;
      transition: color .3s;
    }

    .status.active {
      color: #4da8da;
    }

    .status.success {
      color: #6fcf97;
    }

    .status.fail {
      color: #eb5757;
    }

    /* ── PIN display ── */
    .display {
      display: flex;
      gap: 12px;
      padding: 16px 20px;
      background: #111316;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.8);
      width: 100%;
      justify-content: center;
      min-height: 54px;
      align-items: center;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: border-color .2s, box-shadow .2s;
    }

    .display.error {
      border-color: rgba(235, 87, 87, 0.5);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6), 0 0 12px rgba(235, 87, 87, 0.3);
      animation: shake .32s ease;
    }

    .display.success {
      border-color: rgba(111, 207, 151, 0.5);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6), 0 0 12px rgba(111, 207, 151, 0.3);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #323842;
      background: #1a1c20;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
      transition: all .2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .dot.filled {
      background: #4da8da;
      border-color: #4da8da;
      transform: scale(1.15);
      box-shadow: 0 0 10px #4da8da, inset 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    /* ── Numpad ── */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .key {
      height: 56px;
      background: linear-gradient(to bottom, #2d3138, #22252a);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom-color: rgba(0, 0, 0, 0.4);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #e4e8ef;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: all .1s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      -webkit-tap-highlight-color: transparent;
    }

    .key:hover {
      background: linear-gradient(to bottom, #353a42, #292d33);
      transform: translateY(-1px);
      box-shadow: 0 6px 8px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .key:active {
      background: #1d2025;
      transform: translateY(2px);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6);
      border-top-color: rgba(0, 0, 0, 0.5);
    }

    .key.del {
      font-size: 18px;
      color: #a4b4c4;
    }

    .key.zero {
      grid-column: 2;
    }

    .key.confirm {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(to bottom, #4da8da, #2b7da8);
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 10px rgba(43, 125, 168, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .key.confirm:hover {
      background: linear-gradient(to bottom, #5cbbed, #3391c2);
      box-shadow: 0 6px 14px rgba(43, 125, 168, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    .key.confirm:active {
      background: #23668a;
      transform: translateY(2px);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6);
      border-top-color: rgba(0, 0, 0, 0.5);
    }

    .key.confirm.disabled {
      opacity: 0.3;
      pointer-events: none;
      filter: grayscale(1);
      box-shadow: none;
    }

    /* ── Hint ── */
    .hint {
      font-size: 12px;
      font-weight: 500;
      color: #a3afbd;
      letter-spacing: 1px;
      text-align: center;
      margin-top: 4px;
      text-transform: uppercase;
    }

    /* ── Animations ── */
    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-7px);
      }

      40% {
        transform: translateX(7px);
      }

      60% {
        transform: translateX(-4px);
      }

      80% {
        transform: translateX(4px);
      }
    }

    @keyframes heartbeat {
      0% {
        transform: scale(1);
        box-shadow: inset 0 3px 6px rgba(0, 0, 0, .6);
      }

      14% {
        transform: scale(1.05);
        box-shadow: inset 0 3px 6px rgba(0, 0, 0, .6), 0 0 22px rgba(235, 87, 87, .9);
      }

      28% {
        transform: scale(1);
        box-shadow: inset 0 3px 6px rgba(0, 0, 0, .6), 0 0 8px rgba(235, 87, 87, .4);
      }

      45% {
        transform: scale(1.03);
        box-shadow: inset 0 3px 6px rgba(0, 0, 0, .6), 0 0 16px rgba(235, 87, 87, .6);
      }

      100% {
        transform: scale(1);
        box-shadow: inset 0 3px 6px rgba(0, 0, 0, .6);
      }
    }

    .display.heartbeat {
      animation: shake .28s ease, heartbeat .6s ease .28s;
      border-color: rgba(235, 87, 87, .6) !important;
    }

    .dot.wrong {
      background: #eb5757;
      border-color: #eb5757;
      box-shadow: 0 0 8px rgba(235, 87, 87, .7), inset 0 1px 2px rgba(255, 255, 255, .3);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(6px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    body.visible .panel {
      animation: fadeIn .2s ease;
    }

    /* ── Mode switching ── */
    .pin-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .fingerprint-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .fp-hint {
      font-size: 11px;
      color: #5a6a7a;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

              <path d="M4.81 1.37A6.5 6.5 0 0 1 14.56 7a.5.5 0 1 1-1 0 5.5 5.5 0 0 0-8.25-4.765.5.5 0 0 1-.5-.865m-.89 1.257a.5.5 0 0 1 .04.706A5.48 5.48 0 0 0 2.56 7a.5.5 0 0 1-1 0c0-1.664.626-3.184 1.655-4.333a.5.5 0 0 1 .706-.04ZM1.915 8.02a.5.5 0 0 1 .346.616l-.779 2.767a.5.5 0 1 1-.962-.27l.778-2.767a.5.5 0 0 1 .617-.346m12.15.481a.5.5 0 0 1 .49.51c-.03 1.499-.161 3.025-.727 4.533l-.07.187a.5.5 0 0 1-.936-.351l.07-.187c.506-1.35.634-2.74.663-4.202a.5.5 0 0 1 .51-.49"/>

          </div>
        </div>
        <div class="fp-dots">
          <div class="dot-led"></div>
          <div class="dot-led"></div>
          <div class="dot-led"></div>
          <div class="dot-led"></div>
        </div>
      </div>
      <div class="status" id="fpStatus">Taramak için basılı tut</div>
      <div class="fp-hint">Parmak izini basılı tut</div>
    </div>

  </div>
  <script>
    const app = document.getElementById('app');
    const iconWrap = document.getElementById('iconWrap');
    const lockIcon = document.getElementById('lockIcon');
    const fpIcon = document.getElementById('fpIcon');
    const titleEl = document.getElementById('titleEl');
    const hintEl = document.getElementById('hintEl');
    const display = document.getElementById('display');
    const confirmKey = document.getElementById('confirmKey');
    const pinSection = document.getElementById('pinSection');
    const fpSection = document.getElementById('fpSection');
    const fpStatus = document.getElementById('fpStatus');
    const fpHoldBtn = document.getElementById('fpHoldBtn');
    const fpFillWrap = document.getElementById('fpFillWrap');

    const FP_HOLD_MS = 4000;

    let pin = '', minDigits = 4, maxDigits = 8, mode = 'pin';
    let fpResultPending = false, submitting = false;
    let fpHolding = false, fpStartTime = 0, fpRaf = null, fpDone = false;

    /* ── NUI messages ── */
    window.addEventListener('message', ({ data }) => {
      if (data.action === 'open') {
        pin = '';
        minDigits = data.minDigits || 4;
        maxDigits = data.maxDigits || 8;
        mode = data.mode || 'pin';
        titleEl.textContent = data.title || 'PIN Gir';
        iconWrap.classList.remove('success', 'fail');
        display.classList.remove('error', 'success');
        app.classList.add('visible');

        if (mode === 'fingerprint') {
          pinSection.classList.add('hidden');
          fpSection.classList.remove('hidden');
          iconWrap.classList.add('hidden');
          fpResultPending = true;
          fpDone = false;
          resetFpRing();
          setFpStatus('', data.statusText || 'Taramak için basılı tut');
        } else {
          fpSection.classList.add('hidden');
          pinSection.classList.remove('hidden');
          iconWrap.classList.remove('hidden');
          lockIcon.classList.remove('hidden');
          fpIcon.classList.add('hidden');
          submitting = false;
          setKeys(true);
          hintEl.textContent = minDigits === maxDigits
            ? minDigits + ' digits required'
            : 'min ' + minDigits + ' · max ' + maxDigits + ' digits';
          render();
        }
      }

      if (data.action === 'error') {
        submitting = false;
        setKeys(true);
        // turn dots red
        display.querySelectorAll('.dot').forEach(d => d.classList.add('wrong'));
        // heartbeat pulse animation
        display.classList.remove('heartbeat');
        void display.offsetWidth;
        display.classList.add('heartbeat');
        setTimeout(() => {
          display.classList.remove('heartbeat');
          pin = '';
          render();
        }, 900);
      }

      if (data.action === 'success') {
        display.classList.add('success');
        iconWrap.classList.add('success');
        setTimeout(() => {
          app.classList.remove('visible');
          iconWrap.classList.remove('success', 'fail');
          display.classList.remove('success');
          post('pinSubmit', { confirmed: true });
          pin = ''; render(); submitting = false;
        }, 320);
      }

      if (data.action === 'fingerprint_result') {
        fpResultPending = false;
        fpDone = true;
        cancelFpHold();
        setRingProgress(1, data.success ? 'done' : 'fail');
        if (data.success) {
          fpHoldBtn.classList.add('done');
          setFpStatus('success', data.successText || 'Kimlik doğrulandı');
        } else {
          fpHoldBtn.classList.add('fail-btn');
          setFpStatus('fail', data.failText || 'Erişim reddedildi');
        }
        setTimeout(() => {
          app.classList.remove('visible');
          post('fingerprintComplete', { success: data.success });
          resetFp();
        }, 900);
      }

      if (data.action === 'close') {
        app.classList.remove('visible');
        resetFp();
      }
    });

    function setFpStatus(cls, text) {
      fpStatus.className = 'status' + (cls ? ' ' + cls : '');
      fpStatus.textContent = text;
    }

    function setRingProgress(pct, state) {
      fpFillWrap.style.height = (pct * 100) + '%';
    }

    function resetFpRing() {
      fpFillWrap.style.height = '0%';
      fpHoldBtn.classList.remove('holding', 'done', 'fail-btn');
    }

    function cancelFpHold() {
      if (fpRaf) { cancelAnimationFrame(fpRaf); fpRaf = null; }
      fpHolding = false;
      if (!fpDone) {
        fpHoldBtn.classList.remove('holding');
        setRingProgress(0);
        setFpStatus('', 'Taramak için basılı tut');
      }
    }

    function startFpHold() {
      if (fpDone || !fpResultPending) return;
      fpHolding = true;
      fpStartTime = performance.now();
      fpHoldBtn.classList.add('holding');
      setFpStatus('active', 'Taranıyor…');

      function tick(now) {
        if (!fpHolding) return;
        const elapsed = now - fpStartTime;
        const pct = Math.min(elapsed / FP_HOLD_MS, 1);
        setRingProgress(pct);
        if (pct >= 1) {
          fpHolding = false;
          fpRaf = null;
          // notify Lua that user completed the hold
          post('fingerprintHeld', {});
          return;
        }
        fpRaf = requestAnimationFrame(tick);
      }
      fpRaf = requestAnimationFrame(tick);
    }

    // mouse / touch hold
    fpHoldBtn.addEventListener('mousedown', startFpHold);
    fpHoldBtn.addEventListener('touchstart', e => { e.preventDefault(); startFpHold(); }, { passive: false });
    fpHoldBtn.addEventListener('mouseup', cancelFpHold);
    fpHoldBtn.addEventListener('mouseleave', cancelFpHold);
    fpHoldBtn.addEventListener('touchend', cancelFpHold);
    fpHoldBtn.addEventListener('touchcancel', cancelFpHold);

    function resetFp() {
      fpResultPending = false;
      fpDone = false;
      cancelFpHold();
      resetFpRing();
      setFpStatus('', 'Taramak için basılı tut');
    }

    /* ── PIN input ── */
    document.querySelectorAll('[data-d]').forEach(el => el.addEventListener('click', () => pressDigit(el.dataset.d)));
    document.getElementById('delKey').addEventListener('click', () => { pin = pin.slice(0, -1); render(); });
    confirmKey.addEventListener('click', submitPin);

    function cancelFp() {
      app.classList.remove('visible');
      post('fingerprintComplete', { success: false, cancelled: true });
      post('pinSubmit', { cancelled: true });
      resetFp();
    }

    document.addEventListener('keydown', e => {
      if (!app.classList.contains('visible')) return;
      if (e.key === 'Escape') {
        if (mode === 'pin') cancelPin();
        else cancelFp();
        return;
      }
      if (mode !== 'pin') return;
      if (e.key >= '0' && e.key <= '9') pressDigit(e.key);
      else if (e.key === 'Backspace') { pin = pin.slice(0, -1); render(); }
      else if (e.key === 'Enter') submitPin();
    });

    function pressDigit(d) {
      if (pin.length >= maxDigits) return;
      pin += d;
      render();
      if (pin.length === maxDigits) {
        confirmKey.style.boxShadow = '0 0 0 1px rgba(126,184,212,.35)';
        setTimeout(() => { confirmKey.style.boxShadow = ''; }, 300);
      }
    }

    function render() {
      display.innerHTML = '';
      for (let i = 0; i < maxDigits; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot' + (i < pin.length ? ' filled' : '');
        display.appendChild(dot);
      }
      confirmKey.classList.toggle('disabled', pin.length < minDigits);
    }

    function setKeys(enabled) {
      const allKeys = document.querySelectorAll('.key');
      allKeys.forEach(k => k.style.pointerEvents = enabled ? '' : 'none');
    }

    function submitPin() {
      if (pin.length < minDigits || submitting) return;
      submitting = true;
      setKeys(false);
      post('pinSubmit', { pin: pin });
      // UI stays open — waits for 'success' or 'error' message from Lua
    }

    function cancelPin() {
      if (submitting) return;
      app.classList.remove('visible');
      post('pinSubmit', { cancelled: true });
      pin = ''; render();
    }

    function post(cb, data) {
      fetch('https://oxlyn_backpack/' + cb, { method: 'POST', body: JSON.stringify(data) });
    }

    render();
  </script>
</body>

</html>
